<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AR Video</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:Inter,system-ui,sans-serif;color:#fff;overflow:hidden}
  #scene{position:fixed;inset:0}
  /* overlays */
  .ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;background:#000;z-index:5;transition:opacity .3s}
  .ov.hide{opacity:0;pointer-events:none}
  .ov h1{font:600 24px Sora;letter-spacing:-.02em;margin:0 0 8px}
  .ov p{color:#A9B1BA;font-size:14px;margin:0 0 22px;line-height:1.5;max-width:300px}
  .ov img{width:140px;height:140px;object-fit:cover;border-radius:14px;margin-bottom:22px;border:1px solid #2A3138}
  .btn{background:#0F8F84;color:#fff;border:0;border-radius:999px;padding:14px 28px;font:500 15px Inter;cursor:pointer}
  /* hint bar */
  #hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(16,20,24,.72);backdrop-filter:blur(8px);padding:10px 18px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:10px;z-index:4;white-space:nowrap}
  #hint i{width:8px;height:8px;border-radius:50%;background:#F2A93B;animation:pulse 1.2s infinite}
  #hint.found i{background:#3ED598;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  #snd{position:fixed;top:18px;right:18px;z-index:6;background:rgba(16,20,24,.72);backdrop-filter:blur(8px);color:#fff;border:0;border-radius:999px;padding:9px 14px;font:500 13px Inter}
  /* hide MindAR's default loader */
  .mindar-ui-overlay{display:none!important}
</style>
</head>
<body>

<div class="ov" id="intro"><h1 id="ttl">Starting camera…</h1><p>Allow camera access when asked.</p></div>

<div class="ov hide" id="errOv">
  <h1>Can't start</h1>
  <p id="errMsg"></p>
  <button class="btn" onclick="location.reload()">Try again</button>
</div>

<button id="snd" style="display:none">🔇 Tap for sound</button>
<div id="hint" style="display:none"><i></i><span>Point at the picture</span></div>
<div id="scene"></div>

<script>
const id = (new URLSearchParams(location.search).get('id')||'').replace(/[^a-z0-9]/g,'');
const $ = s=>document.querySelector(s);

function fail(m){ $('#intro').classList.add('hide'); $('#errMsg').textContent=m; $('#errOv').classList.remove('hide'); }

async function init(){
  if(!id) return fail('This link is missing an experience id.');
  const r = await fetch(`api.php?action=get&id=${id}`).then(x=>x.json()).catch(()=>({ok:false,error:'Network error'}));
  if(!r.ok) return fail(r.error||'Experience not found');
  const e = r.item;
  document.title = e.title;
  start(e);
}

function start(e){
  // fit video INSIDE the target frame (contain) — never stretch or crop
  const R = e.ratio, VR = e.vratio || R;
  let w, h;
  if (VR > R) { h = R; w = R / VR; } else { w = 1; h = VR; }
  // Build A-Frame scene only after the tap so autoplay + camera permissions are user-initiated
  $('#scene').innerHTML = `
    <a-scene mindar-image="imageTargetSrc: ${e.mind}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 10; warmupTolerance: 3"
             color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
      <a-assets>
        <video id="vid" src="${e.video}" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video id="plane" src="#vid" width="${w}" height="${h}" position="0 0 0" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>`;

  const scene = $('a-scene'), vid = $('#vid'), hint = $('#hint'), target = $('[mindar-image-target]');

  // Browsers block sound without a tap: start muted, unmute on first touch anywhere
  vid.muted = true;
  const snd = $('#snd'); snd.style.display='block';
  const unmute = ()=>{ vid.muted=false; snd.style.display='none'; document.removeEventListener('pointerdown',unmute); };
  document.addEventListener('pointerdown', unmute, {once:true});

  scene.addEventListener('arReady', ()=>{ $('#intro').classList.add('hide'); hint.style.display='flex'; });

  target.addEventListener('targetFound', ()=>{ hint.classList.add('found'); hint.lastElementChild.textContent='Playing'; vid.play().catch(()=>{}); });
  target.addEventListener('targetLost',  ()=>{ hint.classList.remove('found'); hint.lastElementChild.textContent='Point at the picture'; vid.pause(); });
  scene.addEventListener('arError', ev=>fail('Camera could not start. Check permissions and that you are on HTTPS. ' + (ev.detail?.error||'')));
}

init();
</script>
</body>
</html>
