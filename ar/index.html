<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AR Video Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<style>
  :root{--ink:#101418;--paper:#F7F8F6;--card:#FFFFFF;--line:#E1E5E2;--mute:#6B7480;--teal:#0F8F84;--teal-d:#0B6E66;--amber:#F2A93B;--red:#C9463D}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}
  h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--card)}
  header h1{font-size:18px} header h1 span{color:var(--teal)}
  .btn{border:0;border-radius:10px;padding:11px 16px;font:600 14px Inter;cursor:pointer;background:var(--teal);color:#fff;transition:.15s}
  .btn:hover{background:var(--teal-d)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #F3D3D0}
  .btn.sm{padding:7px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  main{max-width:1100px;margin:0 auto;padding:28px 20px;display:grid;grid-template-columns:300px 1fr;gap:24px}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  .card h2{font-size:16px;margin-bottom:14px}
  label.field{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:14px 0 6px}
  input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:14px Inter;background:#fff}
  .drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--mute);font-size:13px;position:relative;transition:.15s}
  .drop:hover,.drop.on{border-color:var(--teal);background:#EFF8F7;color:var(--teal-d)}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop img,.drop video{max-width:100%;max-height:160px;border-radius:8px;display:block;margin:0 auto 8px}
  .hint{font-size:12px}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:14px;display:none}
  .progress i{display:block;height:100%;width:0;background:var(--teal);transition:width .3s}
  .status{font-size:13px;color:var(--mute);margin-top:8px;min-height:18px}
  .status.err{color:var(--red)}
  .tip{background:#FFF7E6;border:1px solid #F8E3B5;border-radius:10px;padding:10px 12px;font-size:12px;color:#7A5410;margin-top:14px;line-height:1.5}
  .acc{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
  .acc:hover{background:var(--paper)} .acc.on{background:#EFF8F7;border-color:var(--teal)}
  .acc .n{font-weight:600;font-size:14px} .acc .c{font-size:11px;color:var(--mute)}
  .acc .k{font-size:12px;color:var(--mute);background:var(--paper);border-radius:999px;padding:3px 9px}
  .newacc{display:flex;gap:8px;margin-bottom:12px} .newacc input{flex:1}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .head h2{margin:0} a{color:var(--teal)} .head .r{display:flex;gap:8px}
  .code{font-size:12px;color:var(--mute);margin-bottom:18px;word-break:break-all}
  .item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .item img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:#eee}
  .item .t{font-weight:600;font-size:14px} .item .u{font-size:12px;color:var(--mute)}
  .empty{color:var(--mute);font-size:13px;text-align:center;padding:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:520px){.grid2{grid-template-columns:1fr}}
  .modal{position:fixed;inset:0;background:rgba(16,20,24,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
  .modal.open{display:flex}
  .modal .box{background:#fff;border-radius:18px;padding:26px;max-width:380px;width:100%;text-align:center}
  .modal .box h3{font-size:18px;margin-bottom:6px}
  .modal .box p{font-size:13px;color:var(--mute);margin-bottom:16px}
  #qr{display:flex;justify-content:center;margin:0 auto 14px} #qr img,#qr canvas{border-radius:8px}
  .link{font-size:12px;word-break:break-all;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:14px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  #cropModal .box{max-width:560px;text-align:left}
  #cropWrap{max-height:60vh;background:#111;border-radius:10px;overflow:hidden} #cropWrap img{max-width:100%;display:block}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:500 12px Inter;cursor:pointer}
  .chip.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  label.chip{display:inline-block}
  #login{max-width:360px;margin:80px auto;padding:0 20px}
</style>
</head>
<body>

<header>
  <h1>AR <span>Video</span> Studio</h1>
  <button class="btn ghost" id="logoutBtn" style="display:none" onclick="logout()">Sign out</button>
</header>

<div id="login">
  <div class="card">
    <h2>Sign in</h2>
    <label class="field">Admin password</label>
    <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    <div class="status err" id="loginErr"></div>
    <button class="btn" style="width:100%;margin-top:12px" onclick="login()">Open studio</button>
  </div>
</div>

<main id="app" style="display:none">
  <section class="card">
    <h2>Accounts</h2>
    <div class="newacc">
      <input type="text" id="accName" placeholder="New account name" onkeydown="if(event.key==='Enter')createAcc()">
      <button class="btn" onclick="createAcc()">Add</button>
    </div>
    <div id="accList"><div class="empty">Loading…</div></div>
  </section>

  <section class="card" id="detail">
    <div class="empty" style="padding:60px 0">Select an account, or create one.<br>Each account gets one QR that recognises all of its pictures.</div>
  </section>
</main>

<template id="detailTpl">
  <div class="head">
    <h2 id="dName"></h2>
    <div class="r">
      <button class="btn" onclick="showQr()">Show QR</button>
      <button class="btn ghost" onclick="window.open(CUR.qrUrl)">Test player</button>
      <button class="btn danger" onclick="deleteAcc()">Delete</button>
    </div>
  </div>
  <div class="code" id="dCode"></div>

  <h2 style="font-size:14px">Add a picture + video</h2>
  <label class="field">Title</label>
  <input type="text" id="title" placeholder="e.g. Front page, Product box, Page 3">
  <div class="grid2">
    <div>
      <label class="field">Target image (printed picture)</label>
      <div class="drop" id="dropImg"><input type="file" id="imgFile" accept="image/*">
        <div id="imgPrev">Tap to choose an image<br><span class="hint">You can crop it next</span></div></div>
    </div>
    <div>
      <label class="field">Video to play on it
        <span style="float:right;font-weight:500"><a href="#" id="vidMode" onclick="toggleVidMode(event)">Use a URL instead</a></span></label>
      <div class="drop" id="dropVid"><input type="file" id="vidFile" accept="video/mp4,video/*">
        <div id="vidPrev">Tap to choose a video<br><span class="hint">MP4 · under 200 MB</span></div></div>
      <div id="urlBox" style="display:none">
        <input type="text" id="vidUrl" placeholder="https://…/video.mp4" oninput="checkUrl()">
        <div class="status" id="urlSt">Direct MP4 link only — YouTube / Drive links won't work</div>
      </div>
    </div>
  </div>
  <label class="field">How the video sits on the picture</label>
  <div class="chips" style="margin:0">
    <label class="chip on"><input type="radio" name="fit" value="fill" checked hidden> Fill edge to edge</label>
    <label class="chip"><input type="radio" name="fit" value="fit" hidden> Fit inside (no crop)</label>
    <label class="chip"><input type="radio" name="fit" value="stretch" hidden> Stretch</label>
  </div>
  <div class="progress" id="prog"><i></i></div>
  <div class="status" id="st"></div>
  <button class="btn" style="width:100%;margin-top:14px" id="saveBtn" onclick="addItem()">Compile & add</button>
  <div class="tip">Every time you add or remove a picture, all pictures in this account are re-analysed together so one QR recognises them all. Expect ~15–30 s per picture.</div>

  <h2 style="font-size:14px;margin-top:26px">Pictures in this account</h2>
  <div id="items"></div>
</template>

<div class="modal" id="cropModal">
  <div class="box">
    <h3>Crop target image</h3>
    <p>Crop to exactly the printed area.</p>
    <div id="cropWrap"><img id="cropImg" alt=""></div>
    <div class="chips" id="chips">
      <button class="chip on" data-r="0">Free</button><button class="chip" data-r="1">1:1</button>
      <button class="chip" data-r="0.75">4:3</button><button class="chip" data-r="1.3333">3:4</button>
      <button class="chip" data-r="0.5625">16:9</button><button class="chip" data-r="1.7778">9:16</button>
    </div>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" onclick="rotateCrop()">Rotate</button>
      <button class="btn ghost" onclick="cancelCrop()">Cancel</button>
      <button class="btn" onclick="applyCrop()">Use crop</button>
    </div>
  </div>
</div>

<div class="modal" id="qrModal" onclick="if(event.target===this)closeQr()">
  <div class="box">
    <h3 id="qrTitle"></h3>
    <p>One QR for this whole account. Print it once — it recognises every picture added here, now or later.</p>
    <div id="qr"></div>
    <div class="link" id="qrLink"></div>
    <div class="row">
      <button class="btn" onclick="downloadQr()">Download QR</button>
      <button class="btn ghost" onclick="navigator.clipboard.writeText(CUR.qrUrl)">Copy link</button>
      <button class="btn ghost" onclick="closeQr()">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { Compiler } from "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js";
window.MindCompiler = Compiler;
</script>
<script>
const API='api.php';
let PASS=sessionStorage.getItem('arpass')||'', ACCOUNTS=[], CUR=null;
let imgFile=null, vidFile=null, vidUrl='', urlMode=false, imgRatio=1, vidRatio=1, cropper=null;
const $=s=>document.querySelector(s);

async function login(){ PASS=$('#pass').value; const r=await post({action:'login'}); if(!r.ok){$('#loginErr').textContent=r.error;return;} sessionStorage.setItem('arpass',PASS); boot(); }
function logout(){ sessionStorage.removeItem('arpass'); location.reload(); }
function boot(){ $('#login').style.display='none'; $('#app').style.display='grid'; $('#logoutBtn').style.display=''; loadAccounts(); }
async function post(fields,files){
  const fd=new FormData(); Object.entries(fields).forEach(([k,v])=>fd.append(k,v));
  if(files) Object.entries(files).forEach(([k,v])=>fd.append(k,v,v.name||k));
  return (await fetch(API+'?action='+encodeURIComponent(fields.action),{method:'POST',body:fd,headers:{'X-Admin-Pass':PASS}})).json();
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function loadAccounts(keep){
  const r=await post({action:'accounts'}); ACCOUNTS=r.accounts||[];
  $('#accList').innerHTML = ACCOUNTS.length ? ACCOUNTS.map(a=>`
    <div class="acc ${CUR&&CUR.code===a.code?'on':''}" data-code="${a.code}" onclick="openAcc('${a.code}')">
      <div><div class="n">${esc(a.name)}</div><div class="c">${a.code}</div></div>
      <span class="k">${a.items.length} pic${a.items.length===1?'':'s'}</span>
    </div>`).join('') : '<div class="empty">No accounts yet</div>';
  if(keep&&CUR) openAcc(CUR.code);
}
async function createAcc(){
  const name=$('#accName').value.trim(); if(!name) return;
  const r=await post({action:'account_create',name}); if(!r.ok){alert(r.error);return;}
  $('#accName').value=''; await loadAccounts(); openAcc(r.code);
}
function openAcc(code){
  CUR=ACCOUNTS.find(a=>a.code===code); if(!CUR) return;
  document.querySelectorAll('.acc').forEach(d=>d.classList.toggle('on',d.dataset.code===code));
  const d=$('#detail'); d.innerHTML=''; d.appendChild($('#detailTpl').content.cloneNode(true));
  $('#dName').textContent=CUR.name; $('#dCode').textContent='Player link: '+CUR.qrUrl;
  bindPickers(); renderItems(); imgFile=vidFile=null; vidUrl=''; urlMode=false;
}
async function deleteAcc(){
  if(!confirm(`Delete "${CUR.name}" and all its pictures? Its QR will stop working.`)) return;
  await post({action:'account_delete',code:CUR.code}); CUR=null;
  $('#detail').innerHTML='<div class="empty" style="padding:60px 0">Select an account.</div>'; loadAccounts();
}
function renderItems(){
  const sh=r=>r>1.05?'portrait':r<0.95?'landscape':'square';
  $('#items').innerHTML = CUR.items.length ? CUR.items.map(it=>`
    <div class="item">
      <img src="${it.thumb}" alt="">
      <div><div class="t">${esc(it.title)}</div><div class="u">picture ${sh(it.ratio)} · video ${sh(it.vratio)} · ${it.fit||'fill'}</div></div>
      <button class="btn danger sm" onclick="removeItem('${it.id}')">Remove</button>
    </div>`).join('') : '<div class="empty">No pictures yet. Add one above.</div>';
}

function bindPickers(){
  document.querySelectorAll('input[name=fit]').forEach(r=>r.onchange=()=>document.querySelectorAll('input[name=fit]').forEach(x=>x.parentElement.classList.toggle('on',x.checked)));
  $('#imgFile').onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const im=$('#cropImg'); if(cropper){cropper.destroy();cropper=null;}
    im.src=URL.createObjectURL(f); $('#cropModal').classList.add('open');
    im.onload=()=>{ cropper=new Cropper(im,{viewMode:1,autoCropArea:1,background:false,responsive:true}); };
    document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.r==='0'));
  };
  $('#vidFile').onchange=e=>{
    vidFile=e.target.files[0]; if(!vidFile) return;
    const url=URL.createObjectURL(vidFile);
    const v=document.createElement('video'); v.onloadedmetadata=()=>{vidRatio=v.videoHeight/v.videoWidth;}; v.src=url;
    $('#vidPrev').innerHTML=`<video src="${url}" muted playsinline></video><span class="hint">${esc(vidFile.name)} · ${(vidFile.size/1048576).toFixed(1)} MB</span>`;
    $('#dropVid').classList.add('on');
  };
}
function toggleVidMode(e){
  e.preventDefault(); urlMode=!urlMode;
  $('#dropVid').style.display=urlMode?'none':''; $('#urlBox').style.display=urlMode?'':'none';
  $('#vidMode').textContent=urlMode?'Upload a file instead':'Use a URL instead';
}
let urlTimer;
function checkUrl(){
  clearTimeout(urlTimer); vidUrl=$('#vidUrl').value.trim(); vidRatio=1;
  const st=$('#urlSt'); st.className='status'; st.textContent='Direct MP4 link only — YouTube / Drive links won\'t work';
  if(!/^https?:\/\//i.test(vidUrl)) return;
  urlTimer=setTimeout(()=>{
    st.textContent='Checking…';
    const v=document.createElement('video'); v.preload='metadata';
    v.onloadedmetadata=()=>{ vidRatio=v.videoHeight/v.videoWidth; st.textContent=`OK · ${v.videoWidth}×${v.videoHeight} · ${Math.round(v.duration)}s`; };
    v.onerror=()=>{ st.textContent='Could not read that video in the browser — the server will still try to download it'; };
    v.src=vidUrl;
  },500);
}
$('#chips').onclick=e=>{ const c=e.target.closest('.chip'); if(!c||!cropper) return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
  const r=parseFloat(c.dataset.r); cropper.setAspectRatio(r?1/r:NaN); };
function rotateCrop(){ cropper&&cropper.rotate(90); }
function cancelCrop(){ $('#cropModal').classList.remove('open'); $('#imgFile').value=''; }
function applyCrop(){
  const c=cropper.getCroppedCanvas({maxWidth:2000,maxHeight:2000,imageSmoothingQuality:'high'});
  c.toBlob(b=>{ imgFile=new File([b],'target.jpg',{type:'image/jpeg'}); imgRatio=c.height/c.width;
    $('#imgPrev').innerHTML=`<img src="${URL.createObjectURL(b)}"><span class="hint">${c.width}×${c.height} · tap to change</span>`;
    $('#dropImg').classList.add('on'); $('#cropModal').classList.remove('open'); },'image/jpeg',0.92);
}

function setProg(p,msg,err){ const pr=$('#prog'); if(!pr) return; pr.style.display='block'; pr.firstElementChild.style.width=p+'%'; const s=$('#st'); s.textContent=msg; s.className='status'+(err?' err':''); }
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>rej(new Error('Could not load a stored picture')); i.src=src; });
async function compileAll(images, from, to){
  if(!window.MindCompiler) throw new Error('Compiler still loading — try again in a moment');
  const compiler=new window.MindCompiler();
  await compiler.compileImageTargets(images, p=>setProg(from+Math.round(p/100*(to-from)), `Analysing ${images.length} picture${images.length>1?'s':''}… ${Math.round(p)}%`));
  return new File([await compiler.exportData()],'targets.mind');
}

async function addItem(){
  if(!imgFile){setProg(0,'Choose a target image first',true);return;}
  if(urlMode){ if(!/^https?:\/\//i.test(vidUrl)){setProg(0,'Enter a valid video URL',true);return;} }
  else { if(!vidFile){setProg(0,'Choose a video first',true);return;}
         if(vidFile.size>200*1048576){setProg(0,'Video must be under 200 MB',true);return;} }
  const title=$('#title').value.trim()||'Untitled', btn=$('#saveBtn'); btn.disabled=true;
  try{
    setProg(2,'Loading existing pictures…');
    const existing=await Promise.all(CUR.items.map(it=>loadImg(it.thumb+'?v='+Date.now())));
    const mind=await compileAll([...existing, await loadImg(URL.createObjectURL(imgFile))], 5, 85);
    setProg(87, urlMode?'Server is downloading the video…':'Uploading…');
    const fields={action:'item_add',code:CUR.code,title,ratio:imgRatio.toFixed(4),vratio:vidRatio.toFixed(4),fit:(document.querySelector('input[name=fit]:checked')||{}).value||'fill'};
    const files={target:imgFile,mind};
    if(urlMode) fields.video_url=vidUrl; else files.video=vidFile;
    const r=await post(fields,files);
    if(!r.ok) throw new Error(r.error);
    await loadAccounts(true);
  }catch(e){ setProg(0,'Could not add: '+e.message,true); btn.disabled=false; }
}
async function removeItem(id){
  if(!confirm('Remove this picture from the account?')) return;
  const btn=$('#saveBtn'); btn.disabled=true;
  try{
    const rest=CUR.items.filter(it=>it.id!==id); let files;
    if(rest.length){ setProg(5,'Re-analysing remaining pictures…'); const imgs=await Promise.all(rest.map(it=>loadImg(it.thumb+'?v='+Date.now()))); files={mind:await compileAll(imgs,10,90)}; }
    setProg(92,'Saving…');
    const r=await post({action:'item_delete',code:CUR.code,id},files); if(!r.ok) throw new Error(r.error);
    await loadAccounts(true);
  }catch(e){ setProg(0,'Could not remove: '+e.message,true); btn.disabled=false; }
}

function showQr(){
  $('#qrTitle').textContent=CUR.name; $('#qrLink').textContent=CUR.qrUrl;
  const q=$('#qr'); q.innerHTML=''; new QRCode(q,{text:CUR.qrUrl,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  $('#qrModal').classList.add('open');
}
function closeQr(){ $('#qrModal').classList.remove('open'); }
function downloadQr(){ const c=$('#qr canvas'); if(!c) return; const a=document.createElement('a'); a.download=CUR.name.replace(/\s+/g,'-')+'-qr.png'; a.href=c.toDataURL('image/png'); a.click(); }

if(PASS) post({action:'login'}).then(r=>{ if(r.ok) boot(); else logout(); });
</script>
</body>
</html>
