<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ATMA — AR Ghost</title>
<style>
  :root{--night:#04060c; --spirit:#7fd8e8; --ember:#f2b544; --bone:#e8e4da; --mist:#9fb4c4;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}

  #container{position:fixed;inset:0;width:100%;height:100%;display:flex;flex-direction:column}
  
  #camContainer{position:relative;flex:1;overflow:hidden;background:#1a1a1a}
  #cam{width:100%;height:100%;display:block;object-fit:cover}
  
  #ghostOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #ghost{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:200px;height:300px;background-image:url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg"><defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="M30 50 Q20 50 20 60 L20 90 Q20 110 30 115 L35 130 Q35 135 30 135 Q25 135 25 130 L20 115 Q15 120 15 130 L15 135 L10 135 Q8 135 10 130 L15 110 Q10 120 10 130 L10 135 L5 135 Q3 135 5 130 L12 110 Q8 100 8 85 L8 60 Q8 45 20 40 Q25 30 50 25 Q75 30 80 40 Q92 45 92 60 L92 85 Q92 100 88 110 L95 130 Q97 135 95 135 L90 135 L90 130 Q90 120 85 110 L80 115 Q85 135 80 135 Q75 135 75 130 L70 115 Q80 110 80 90 L80 60 Q80 50 70 50 Q60 48 50 48 Q40 48 30 50 Z" fill="rgba(200,220,240,0.8)" filter="url(%23glow)" stroke="rgba(100,180,255,0.6)" stroke-width="0.5"/><circle cx="38" cy="65" r="4" fill="rgba(100,150,200,0.9)"/><circle cx="62" cy="65" r="4" fill="rgba(100,150,200,0.9)"/></svg>');background-size:contain;background-repeat:no-repeat;background-position:center;opacity:0.3}
  #ghost.visible{opacity:0.9}

  #hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #heading{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.6);color:var(--spirit);padding:8px 16px;border-radius:4px;font-size:13px;font-family:monospace;border:1px solid var(--spirit);z-index:10}
  #subtitle{position:absolute;bottom:120px;left:10%;right:10%;text-align:center;color:var(--bone);font-size:14px;font-style:italic;text-shadow:0 0 10px rgba(127,216,232,0.5);opacity:0;transition:opacity 0.5s;z-index:10}
  #subtitle.show{opacity:1}
  #subtitle .te{display:block;font-size:0.9em;color:var(--spirit);margin-top:4px}

  #trust{position:absolute;top:20px;left:20px;display:flex;gap:6px;z-index:10}
  .dot{width:5px;height:5px;border-radius:50%;border:1px solid var(--mist);background:transparent}
  .dot.lit{background:var(--ember);border-color:var(--ember)}

  #holdRing{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);width:60px;height:60px;display:none;z-index:10}
  #holdRing svg{width:100%;height:100%;transform:rotate(-90deg)}
  #holdRing .track{fill:none;stroke:rgba(159,180,196,0.2);stroke-width:1.5}
  #holdRing .prog{fill:none;stroke:var(--spirit);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:180}

  #controls{position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);display:flex;align-items:center;justify-content:center;gap:20px;pointer-events:auto;z-index:10}
  button{background:rgba(127,216,232,0.1);border:1px solid var(--spirit);color:var(--spirit);padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit}
  button:active{background:rgba(127,216,232,0.2)}
  button:disabled{opacity:0.3;cursor:not-allowed}

  .screen{position:fixed;inset:0;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:100;font-family:Georgia,serif;padding:30px;display:none}
  .screen.show{display:flex}
  h1{font-size:48px;color:var(--bone);margin-bottom:20px}
  h1 small{display:block;font-size:0.4em;color:var(--spirit);letter-spacing:0.2em;margin-top:8px}
  p{color:var(--mist);font-size:14px;margin:10px 0;max-width:300px}
  input{background:rgba(127,216,232,0.1);border:1px solid var(--spirit);color:var(--bone);padding:10px;border-radius:4px;margin:10px 0;width:200px;font-size:13px}
  input::placeholder{color:rgba(159,180,196,0.5)}
</style>
</head>
<body>

<div id="container">
  <div id="camContainer">
    <video id="cam" autoplay playsinline muted></video>
    <div id="ghostOverlay">
      <div id="ghost"></div>
    </div>
    <div id="hud">
      <div id="heading">Heading: 0°</div>
      <div id="trust"></div>
      <div id="subtitle"></div>
      <div id="holdRing">
        <svg viewBox="0 0 60 60">
          <circle class="track" cx="30" cy="30" r="27"/>
          <circle class="prog" id="progC" cx="30" cy="30" r="27"/>
        </svg>
      </div>
    </div>
  </div>
  <div id="controls">
    <button id="candleBtn">🕯 Hint</button>
    <button id="muteBtn">🔊</button>
  </div>
</div>

<div id="permScreen" class="screen show">
  <h1>ATMA<small>ఆత్మ</small></h1>
  <p>A girl died in this room.</p>
  <p>Help her find peace.</p>
  <button id="permBtn" style="margin-top:20px">Grant Camera Access</button>
</div>

<div id="nameScreen" class="screen">
  <h1>ATMA<small>ఆత్మ</small></h1>
  <p>In <span id="nameLoc">this room</span>, what is your name?</p>
  <input type="text" id="userName" placeholder="Your name" maxlength="30">
  <button id="startBtn" style="margin-top:20px">Begin</button>
</div>

<div id="endScreen" class="screen">
  <h1>Free</h1>
  <p>Thank you, <span id="endName">—</span>.</p>
  <p style="font-size:12px">The soul has found peace.</p>
  <button id="againBtn" style="margin-top:20px">Begin again</button>
</div>

<script>
(function(){
"use strict";

var TRUST_MAX = 5;
var data = {
  name:"", location:"this room", language:"te",
  phase:"idle", trust:0, heading:0, inView:false, candles:3, muted:false,
  holdStart:0
};

var LINES = {
  te:[
    {en:"I'm cold.", te:"నేను చల్లగా ఉన్నాను."},
    {en:"You see me?", te:"నన్ను చూడగలరా?"},
    {en:"Everyone left.", te:"ఇతరులు నన్ను దాటిపోయారు."},
    {en:"I was alone.", te:"నేను ఒంటరిగా చనిపోయాను."},
    {en:"Will you help?", te:"సహాయం చేస్తారా?"}
  ]
};

function $(id){return document.getElementById(id);}
var cam=$("cam"), ghost=$("ghost"), heading=$("heading"), subtitle=$("subtitle");
var trustBox=$("trust"), progC=$("progC"), holdRing=$("holdRing");
var candleBtn=$("candleBtn"), muteBtn=$("muteBtn");

// Build trust dots
for(var i=0;i<TRUST_MAX;i++){var d=document.createElement("div");d.className="dot";trustBox.appendChild(d);}
function updateTrust(){
  var dots=trustBox.children;
  for(var i=0;i<dots.length;i++) dots[i].className="dot"+(i<data.trust?" lit":"");
}

// Audio
var AC=null;
function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function playSound(){
  if(!AC || data.muted) return;
  try{
    var now=AC.currentTime, osc=AC.createOscillator(), gain=AC.createGain();
    osc.frequency.value=45; osc.type="sine";
    gain.gain.setValueAtTime(0.08, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now+1);
    osc.connect(gain); gain.connect(AC.destination);
    osc.start(now); osc.stop(now+1);
  }catch(e){}
}

muteBtn.addEventListener("click", function(){
  data.muted = !data.muted;
  muteBtn.textContent = data.muted ? "🔇" : "🔊";
});

// Orientation
function onOrient(e){
  var h = null;
  if(typeof e.webkitCompassHeading === "number") h = e.webkitCompassHeading;
  else if(e.absolute && typeof e.alpha === "number") h = (360 - e.alpha) % 360;
  if(h === null) return;
  
  data.heading = Math.round(h);
  heading.textContent = "Heading: " + data.heading + "°";
  
  // Check if facing ghost (heading ~300°, range 250-350°)
  var diff = Math.abs(data.heading - 300);
  if(diff > 180) diff = 360 - diff;
  data.inView = diff < 50;
  
  ghost.classList.toggle("visible", data.inView && data.phase !== "idle");
}

// Desktop fallback
var lastX=0, dragging=false;
addEventListener("pointerdown", e=>{dragging=true;lastX=e.clientX;});
addEventListener("pointermove", e=>{
  if(!dragging)return;
  data.heading=(data.heading+(e.clientX-lastX)*0.5)%360;
  lastX=e.clientX;
  heading.textContent="Heading: "+data.heading+"°";
  var diff=Math.abs(data.heading-300);if(diff>180)diff=360-diff;
  data.inView=diff<50;
  ghost.classList.toggle("visible",data.inView&&data.phase!=="idle");
});
addEventListener("pointerup", ()=>{dragging=false;});

// Show line
function showLine(line){
  subtitle.innerHTML=line.en+'<span class="te">'+line.te+'</span>';
  subtitle.classList.add("show");
  playSound();
  setTimeout(()=>subtitle.classList.remove("show"), 4000);
}

// Find ghost
function find(){
  data.phase="speak";
  holdRing.style.display="none";
  var line=LINES[data.language][data.trust];
  data.trust++;
  updateTrust();
  showLine(line);
  if(navigator.vibrate)navigator.vibrate([80,100,80]);
  setTimeout(()=>{
    if(data.trust>=TRUST_MAX){
      data.phase="final";
      showLine({en:"Take my hand.", te:"చెయ్యి ఇవ్వు."});
    }else{
      data.phase="seek";
    }
  }, 3000);
}

// Hold ring loop
var holdStart=0;
function loop(t){
  if(data.phase==="seek" && data.inView){
    if(!holdStart) holdStart=t;
    var pct=Math.min(1,(t-holdStart)/1500);
    holdRing.style.display="block";
    progC.style.strokeDashoffset=180*(1-pct);
    if(pct>=1){holdStart=0;find();}
  } else if(data.phase==="final" && data.inView){
    if(!holdStart) holdStart=t;
    var pct=Math.min(1,(t-holdStart)/2000);
    holdRing.style.display="block";
    progC.style.strokeDashoffset=180*(1-pct);
    if(pct>=1){
      data.phase="done";
      holdStart=0;
      ghost.style.opacity="0";
      setTimeout(()=>{
        $("nameScreen").classList.remove("show");
        $("endScreen").classList.add("show");
        $("endName").textContent=data.name;
      }, 500);
    }
  } else {
    holdStart=0;
    holdRing.style.display="none";
    progC.style.strokeDashoffset=180;
  }
  requestAnimationFrame(loop);
}

candleBtn.addEventListener("click", ()=>{
  if(data.candles<=0)return;
  data.candles--;
  candleBtn.textContent="🕯 Hint ("+data.candles+")";
  subtitle.innerHTML="Turn to <span style='color:var(--spirit)'>300°</span>";
  subtitle.classList.add("show");
  setTimeout(()=>subtitle.classList.remove("show"),2000);
});

// Camera + sensors
function startCamera(){
  return navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
    .then(s=>{cam.srcObject=s;})
    .catch(e=>{console.log("cam denied")});
}

function startSensors(){
  if(window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission){
    DeviceOrientationEvent.requestPermission().then(()=>{
      addEventListener("deviceorientationabsolute", onOrient);
    }).catch(()=>{});
  }else{
    addEventListener("deviceorientation", onOrient);
  }
}

// Permissions
$("permBtn").addEventListener("click", ()=>{
  $("permScreen").classList.remove("show");
  $("nameScreen").classList.add("show");
  startCamera().then(startSensors);
});

// Start
$("startBtn").addEventListener("click", ()=>{
  data.name=$("userName").value||"friend";
  $("nameScreen").classList.remove("show");
  initAudio();
  
  data.phase="seek";
  updateTrust();
  
  subtitle.innerHTML=data.name+", <span class='te'>turn to 300°...</span>";
  subtitle.classList.add("show");
  playSound();
  setTimeout(()=>{
    showLine(LINES[data.language][0]);
    requestAnimationFrame(loop);
  }, 2000);
});

$("againBtn").addEventListener("click", ()=>location.reload());

})();
</script>
</body>
</html>
