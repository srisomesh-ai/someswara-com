<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ATMA 3D — Chapter 1</title>
<style>
  :root{
    --night:#04060c;
    --mist:#9fb4c4;
    --spirit:#7fd8e8;
    --ember:#f2b544;
    --bone:#e8e4da;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--night);color:var(--bone);font-family:Georgia,serif;overflow:hidden}
  
  #canvas{display:block;width:100%;height:100%}
  
  #debug{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.8);color:var(--spirit);
    padding:10px;font-size:12px;max-height:40%;overflow-y:auto;z-index:999;font-family:monospace}
  
  #hud{position:fixed;inset:0;pointer-events:none;display:none}
  #chapterTag{position:absolute;top:14px;left:0;right:0;text-align:center;
    letter-spacing:.35em;font-size:11px;color:var(--mist);text-transform:uppercase;opacity:.85;z-index:20}
  #trust{position:absolute;top:34px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:20}
  .dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(159,180,196,.5);transition:all .6s}
  .dot.lit{background:var(--ember);border-color:var(--ember);box-shadow:0 0 10px 2px rgba(242,181,68,.5)}
  
  #subtitle{position:absolute;left:8%;right:8%;bottom:24%;text-align:center;
    font-size:clamp(17px,4.6vw,22px);line-height:1.55;font-style:italic;
    color:var(--bone);text-shadow:0 0 14px rgba(127,216,232,.55),0 2px 6px #000;
    opacity:0;transition:opacity 1.1s;z-index:20;pointer-events:none}
  #subtitle.show{opacity:1}
  #subtitle .te{display:block;font-size:.82em;color:var(--spirit);margin-top:6px;font-style:normal}
  
  #holdRing{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:92px;height:92px;display:none;z-index:20}
  #holdRing svg{width:100%;height:100%;transform:rotate(-90deg)}
  #holdRing .track{fill:none;stroke:rgba(159,180,196,.25);stroke-width:3}
  #holdRing .prog{fill:none;stroke:var(--spirit);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:264;stroke-dashoffset:264;filter:drop-shadow(0 0 6px var(--spirit))}
  
  #candleBtn{position:absolute;pointer-events:auto;bottom:26px;left:50%;transform:translateX(-50%);
    background:rgba(4,6,12,.55);border:1px solid rgba(242,181,68,.45);color:var(--ember);
    border-radius:999px;padding:11px 22px;font-size:14px;letter-spacing:.06em;
    backdrop-filter:blur(6px);cursor:pointer;z-index:30}
  #candleBtn:disabled{opacity:.35}
  #muteBtn{position:absolute;pointer-events:auto;top:10px;right:14px;background:none;border:none;
    color:var(--mist);font-size:20px;cursor:pointer;opacity:.8;z-index:30}
  
  .screen{position:fixed;inset:0;background:var(--night);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:34px 26px;z-index:100}
  .eyebrow{letter-spacing:.4em;font-size:11px;color:var(--mist);text-transform:uppercase;margin-bottom:18px}
  h1{font-size:clamp(42px,13vw,72px);font-weight:normal;letter-spacing:.14em;color:var(--bone)}
  h1 .te{display:block;font-size:.38em;color:var(--spirit);margin-top:10px}
  .story{max-width:420px;margin:26px 0 34px;font-size:16px;line-height:1.8;color:var(--mist)}
  .story b{color:var(--bone)}
  .cta{background:none;border:1px solid var(--spirit);color:var(--spirit);padding:15px 44px;
    border-radius:999px;font-size:16px;letter-spacing:.12em;cursor:pointer;text-transform:uppercase}
</style>
</head>
<body>

<div id="debug"></div>
<canvas id="canvas"></canvas>

<div id="hud">
  <div id="chapterTag">Chapter One · The Voice at the Gate</div>
  <div id="trust"></div>
  <div id="subtitle"></div>
  <div id="holdRing">
    <svg viewBox="0 0 92 92"><circle class="track" cx="46" cy="46" r="42"/>
    <circle class="prog" id="progC" cx="46" cy="46" r="42"/></svg>
  </div>
  <button id="candleBtn">🕯 Spirit candle · <span id="candleCt">3</span></button>
  <button id="muteBtn">🔊</button>
</div>

<div class="screen" id="startScreen">
  <div class="eyebrow">A story you walk through</div>
  <h1>ATMA<span class="te">ఆత్మ</span></h1>
  <p class="story">Near the old gate, people say a young man died before he could say one last word.<br><br>
    <b>His soul is still here. He hides from everyone.</b><br><br>
    Open your eyes. Turn slowly. Find him.</p>
  <button class="cta" id="startBtn">Light the candle</button>
</div>

<script>
var DEBUG = document.getElementById("debug");
function log(msg){
  DEBUG.innerHTML += msg + "<br>";
  console.log(msg);
}

log("Page loaded at " + new Date().toLocaleTimeString());

// Check if Three.js is available
setTimeout(function(){
  if(typeof THREE === "undefined"){
    log("⚠️ Three.js NOT loaded from CDN");
    log("Trying local fallback...");
    loadLocalThree();
  }else{
    log("✓ Three.js loaded: " + THREE.REVISION);
    initGame();
  }
}, 100);

function loadLocalThree(){
  // If CDN fails, create a minimal mock or try alternative
  log("Attempting alternative CDN...");
  var script = document.createElement("script");
  script.src = "https://unpkg.com/three@r128/build/three.min.js";
  script.onload = function(){
    log("✓ Alternative CDN loaded Three.js");
    initGame();
  };
  script.onerror = function(){
    log("✗ Failed to load Three.js from any source");
    DEBUG.style.color = "#f2b544";
    DEBUG.innerHTML += "<br>Please check internet connection and refresh.";
  };
  document.head.appendChild(script);
}

function initGame(){
  log("Initializing game...");
  var $ = document.getElementById.bind(document);
  var canvas = $("canvas");
  
  try{
    log("Creating THREE.Scene...");
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x04060c);
    log("✓ Scene created");
    
    log("Creating camera...");
    var camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
    camera.position.z = 4;
    log("✓ Camera created at z=" + camera.position.z);
    
    log("Creating renderer...");
    var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    log("✓ Renderer created: " + innerWidth + "x" + innerHeight);
    
    log("Creating lights...");
    var light = new THREE.PointLight(0x7fd8e8, 2, 100);
    light.position.set(0, 2, 3);
    scene.add(light);
    var ambient = new THREE.AmbientLight(0x4a6fa5, 0.5);
    scene.add(ambient);
    log("✓ Lights added");
    
    log("Creating ghost...");
    var geom = new THREE.SphereGeometry(1, 32, 32);
    var mat = new THREE.MeshStandardMaterial({
      color: 0x7fd8e8,
      emissive: 0x5ab5d8,
      emissiveIntensity: 1.0,
      metalness: 0.2,
      roughness: 0.4
    });
    var ghost = new THREE.Mesh(geom, mat);
    scene.add(ghost);
    log("✓ Ghost created");
    
    log("Starting render loop...");
    function animate(){
      ghost.rotation.x += 0.005;
      ghost.rotation.y += 0.008;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
    log("✓ Animation running");
    
    DEBUG.style.color = "#7fd8e8";
    log("GAME READY - Click 'Light the candle' to begin");
    $("startScreen").style.display = "flex";
    
  }catch(e){
    log("✗ ERROR: " + e.message);
    log(e.stack);
  }
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</body>
</html>
